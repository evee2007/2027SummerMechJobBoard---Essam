name: Daily job update

on:
  schedule:
    - cron: "17 9 * * *"   # every day, about 4:17 am Toronto time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull new listings and rebuild the board
        run: python scripts/update.py
      - name: Commit if anything changed
        run: |
          git config user.name "board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data index.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily update: $(date -u +%F)"
          git push
